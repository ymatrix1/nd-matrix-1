[project]
name = "nord-stage-4-tools"
version = "0.1.6"
description = "Reverse-engineering, CBIN/.ns4b inspection, and CI quality gate tools for the ND Matrix 1."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "pillow>=10.0.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "unicorn>=2.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
pythonpath = ["tools"]
