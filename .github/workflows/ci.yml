# Pre-push quality gates from AGENTS.md, run on every PR and push to main.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes its in-flight run. main pushes and v* tags are
# never cancelled so every main commit and release tag gets a complete result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust DSP & CBIN Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies (ALSA, JACK, X11/GL)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" | sudo tee /etc/resolv.conf
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Updating apt and installing dependencies..."
            if sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20 && \
               sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 libasound2-dev libudev-dev libjack-jackd2-dev libgl-dev libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev libxfixes-dev libxrender-dev libxinerama-dev pkg-config; then
              echo "Dependencies installed successfully."
              break
            fi
            sleep 5
          done

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-targets --all-features

      - name: Bundle CLAP & VST3 plugins
        run: cargo xtask bundle nord-plugin

  python:
    name: Python Tools & Unit-Test Ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check tools/

      - name: Ruff format check
        run: uv run ruff format --check tools/

      - name: Pytest suite
        run: uv run pytest -v

      - name: Every source file has a unit test (ratchet)
        run: uv run python tools/check_tests.py

      - name: Firmware-derived files only shrink (ratchet)
        run: uv run python tools/check_fw_derived.py

      - name: No vendor photos tracked or embedded
        run: uv run python tools/check_no_vendor_photos.py

  licenses:
    name: No copyleft crate in the shipped plugin tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: nord-plugin dependency licenses (D233)
        run: python3 tools/check_licenses.py

  third-party-notices:
    name: Third-party license notices are complete (cargo-about)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_ABOUT_VERSION: '0.8.4' # keep equal to release.yml (D238)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-about
        id: cargo-about
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        run: cargo install --locked "cargo-about@${CARGO_ABOUT_VERSION}"

      # Fails when a crate carries a license that about.toml does not list in `accepted`,
      # or when a license text cannot be found, so the release notices stay complete.
      - name: cargo about generate (all workspace crates, all three target OSes)
        run: |
          cargo about generate --locked --fail --workspace --all-features \
            -c about.toml about.hbs -o THIRD_PARTY_LICENSES.html
          test -s THIRD_PARTY_LICENSES.html

  dco:
    name: DCO sign-off on PR commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit has Signed-off-by (merge commits exempt)
        run: python3 tools/check_dco.py "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
