# Continuous Delivery: builds release archives for Linux, Windows and macOS.
#
#   push tag vX.Y.Z      -> build, verify, then publish a GitHub Release
#   dispatch + tag input -> same, for an existing tag (checked out at that tag)
#   dispatch, no tag     -> DRY RUN: build, package, verify, upload artifacts only
#
# Tests are not repeated here: ci.yml already runs the full suite on every
# v* tag push, and docs/RELEASING.md requires a green CI on the commit before tagging.
# See docs/RELEASING.md.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.1.0). Leave empty for a dry run that only uploads artifacts.'
        required: false
        type: string

permissions:
  contents: read

env:
  # Pinned: output format and license detection change between cargo-about releases (D238).
  CARGO_ABOUT_VERSION: '0.8.4'

# Never cancel a release in flight; two runs for one tag queue instead.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan (tag and publish decision)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Decide tag and whether to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=""
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME" # dispatch started "from" a tag
          fi
          if [ -z "$tag" ]; then
            echo "Dry run: no tag. Artifacts only, nothing is published."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$tag' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          # Publishing never creates a tag: it must already exist on the remote.
          git ls-remote --exit-code --tags "https://github.com/$REPO" "refs/tags/$tag" > /dev/null \
            || { echo "::error::tag $tag does not exist in $REPO"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Checkout tag (sparse, for the version check)
        if: steps.plan.outputs.tag != ''
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.plan.outputs.tag }}
          sparse-checkout: |
            Cargo.toml
            tools

      - name: Tag must equal the Cargo.toml workspace version
        if: steps.plan.outputs.tag != ''
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: python3 tools/release_package.py --check-tag "$TAG"

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: '.exe'
          - os: macos-latest # Apple silicon (arm64)
            target: aarch64-apple-darwin
            exe: ''

    steps:
      - name: Checkout repository (at the tag when there is one)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag != '' && format('refs/tags/{0}', needs.plan.outputs.tag) || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          save-if: false # release runs are rare; do not pay for a cache upload

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache cargo-about
        id: cargo-about
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-about
            ~/.cargo/bin/cargo-about.exe
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-about
        if: steps.cargo-about.outputs.cache-hit != 'true'
        shell: bash
        run: cargo install --locked "cargo-about@${CARGO_ABOUT_VERSION}"

      # Fails the release when any crate has a license outside about.toml `accepted`.
      # Covers all three target OSes (about.toml `targets`), so every job writes the same file.
      - name: Generate THIRD_PARTY_LICENSES.html (third-party license notices)
        shell: bash
        run: |
          set -euo pipefail
          cargo about generate --locked --fail --workspace --all-features \
            -c about.toml about.hbs -o THIRD_PARTY_LICENSES.html
          test -s THIRD_PARTY_LICENSES.html

      - name: Install Linux system dependencies (ALSA, JACK, X11/GL)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" | sudo tee /etc/resolv.conf
          for i in 1 2 3 4 5; do
            echo "Attempt $i: Updating apt and installing dependencies..."
            if sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=20 && \
               sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5 libasound2-dev libudev-dev libjack-jackd2-dev libgl-dev libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libxext-dev libxfixes-dev libxrender-dev libxinerama-dev pkg-config desktop-file-utils; then
              echo "Dependencies installed successfully."
              break
            fi
            sleep 5
          done

      # Separate invocations on purpose: one combined `cargo build -p a -p b -p c`
      # would unify nord-gui features across the three packages.
      - name: Build release binaries and plugin bundles
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${{ matrix.target }}" -p nord-core --bin ns4
          cargo build --release --locked --target "${{ matrix.target }}" -p nord-gui --bin nd-matrix-1
          cargo build --release --locked --target "${{ matrix.target }}" -p nord-plugin --bin nd-matrix-1-standalone
          cargo xtask bundle nord-plugin --release --locked --target "${{ matrix.target }}"

      - name: Smoke test the CLI
        shell: bash
        run: target/${{ matrix.target }}/release/ns4${{ matrix.exe }} info

      - name: Package archive and SHA256 file
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          args=(--target "${{ matrix.target }}" --out dist)
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          python tools/release_package.py "${args[@]}"

      # LGPL-2.1 (libfuse is static in the AppImage runtime): ship the corresponding source as a
      # release asset. Every download is checked against the sha256 pins in the script (D242).
      - name: Build AppImage runtime sources asset (Linux)
        if: runner.os == 'Linux'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--out dist)
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          python tools/release_runtime_sources.py "${args[@]}"

      - name: Verify archive (layout, forbidden content, plugin exports, checksum)
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/*.zip dist/*.tar.gz; do
            [ -e "$archive" ] || continue
            case "$archive" in *-appimage-runtime-sources.tar.gz) continue ;; esac
            python tools/release_verify.py "$archive" --target "${{ matrix.target }}"
          done

      - name: Download appimagetool (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  /tmp/appimagetool" | sha256sum -c -
          chmod +x /tmp/appimagetool
          # Pinned runtime (D242): without --runtime-file appimagetool downloads the moving
          # `continuous` runtime. tools/release_installers.py checks the sha256 pinned in
          # tools/release_package.py before building.
          curl -fsSL -o /tmp/appimage-runtime \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64

      - name: Build native OS installers and SHA256 files
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          args=(--target "${{ matrix.target }}" --out dist)
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          if [ "${{ runner.os }}" = "Linux" ]; then args+=(--appimagetool /tmp/appimagetool --appimage-runtime /tmp/appimage-runtime); fi
          python tools/release_installers.py "${args[@]}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets; no other job has this
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Combine and check SHA256SUMS.txt
        working-directory: artifacts
        run: |
          set -euo pipefail
          cat ./*.sha256 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -l

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          prerelease: ${{ contains(needs.plan.outputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Early release. **Provided AS IS, without warranty or support of any kind.**
            The CLAP/VST3 plugin has not been verified in any DAW yet (see `docs/HOST_COMPATIBILITY.md`).
            Builds are unsigned. Verify downloads against `SHA256SUMS.txt`.

            **Distribution formats included:**
            - **Windows (x86_64):** `-setup.exe` installer (GUI, CLI, selectable VST3 & CLAP) and portable `.zip`
            - **macOS (arm64):** `.pkg` installer (selectable app, VST3 & CLAP), `.dmg` disk image, and portable `.tar.gz`
            - **Linux (x86_64):** `.deb` package, portable `.AppImage`, and `.tar.gz`
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.pkg
            artifacts/*.sha256
            artifacts/SHA256SUMS.txt
