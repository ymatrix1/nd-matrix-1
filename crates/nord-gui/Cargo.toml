[package]
name = "nord-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "1:1 Hardware Front-Panel GUI and standalone application for the ND Matrix 1"

[lib]
name = "nord_gui"
path = "src/lib.rs"

[[bin]]
name = "nd-matrix-1"
path = "src/main.rs"
required-features = ["app"]

[features]
# `app` pulls the native window, audio output and MIDI input. The DAW plugin editor depends on
# this crate with `default-features = false` to reuse the panel without cpal/midir/eframe.
default = ["app"]
app = ["dep:eframe", "dep:cpal", "dep:midir", "picker"]
# Native file dialogs (`rfd`), run on a worker thread so a DAW host's UI thread never blocks.
picker = ["dep:rfd", "dep:wayland-sys"]

[target.'cfg(target_os = "linux")'.dependencies]
# rfd's xdg-portal backend (ashpd) enables wayland-sys' link-time `client` build, which needs
# libwayland-dev; `dlopen` loads libwayland-client at runtime instead, as winit does, so a plugin
# build needs no extra system package (CI bundle step, D218).
wayland-sys = { version = "0.31", features = ["dlopen"], optional = true }

[target.'cfg(windows)'.dependencies]
# Audio thread priority (MMCSS "Pro Audio" + THREAD_PRIORITY_TIME_CRITICAL), `audio/priority.rs`.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dependencies]
nord-core = { path = "../nord-core" }
nord-panel = { path = "../nord-panel" }
egui = "0.31"
eframe = { optional = true, version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
cpal = { version = "0.15", optional = true }
midir = { version = "0.10", optional = true }
rfd = { version = "0.15", optional = true }
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
