[package]
name = "nord-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
description = "CLAP and VST3 DAW Plugin and Standalone wrapper for the ND Matrix 1"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "nd-matrix-1-standalone"
path = "src/main.rs"

[dependencies]
nord-core = { path = "../nord-core" }
# `picker`: native file dialogs (rfd) on a worker thread, no window / audio / MIDI stack.
nord-gui = { path = "../nord-gui", default-features = false, features = ["picker"] }
nord-panel = { path = "../nord-panel" }
nih_plug_egui = { git = "https://github.com/davemollen/nih-plug.git", rev = "95034d55de49b3d792289a0faf5df15b889e86d9" }
nih_plug = { git = "https://github.com/davemollen/nih-plug.git", rev = "95034d55de49b3d792289a0faf5df15b889e86d9", features = ["vst3", "standalone"] }
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
